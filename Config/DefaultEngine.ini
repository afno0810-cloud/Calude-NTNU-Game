[/Script/Engine.RendererSettings]
; Lumen (global illumination + reflections) with HARDWARE ray tracing on RTX cards.
; Console: "Straaling 0" switches to software Lumen if the frame rate is too low, "Straaling 1" back on.
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Lumen.HardwareRayTracing=True
r.Lumen.HardwareRayTracing.LightingMode=1
r.Lumen.TranslucencyReflections.FrontLayer.EnableForProject=True
r.Lumen.TraceMeshSDFs=1
r.GenerateMeshDistanceFields=True
r.Shadow.Virtual.Enable=1
r.AllowStaticLighting=False
; Nanite for detailed meshes (buildings, Megascans, Fab)
r.Nanite.ProjectEnabled=True
; Temporal Super Resolution: renders below native and upscales, looks sharp and saves GPU
r.AntiAliasingMethod=4
r.TSR.ShadingRejection.Flickering=1
r.Tonemapper.Sharpen=0.6
; Physically based exposure range, needed for a realistic sun and night
r.DefaultFeature.AutoExposure=True
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
r.DefaultFeature.Bloom=True
r.DefaultFeature.MotionBlur=True
r.DefaultFeature.LensFlare=False
r.SupportSkyAtmosphere=True
r.SupportSkyAtmosphereAffectsHeightFog=True
r.VolumetricFog=1
r.VirtualTextures=True
r.CustomDepth=3
r.SkinCache.CompileShaders=True
; Hardware ray tracing (needed by the line above). The first start compiles extra shaders, which takes a while.
r.RayTracing=True
r.RayTracing.Shadows=False
r.RayTracing.UseTextureLod=1

