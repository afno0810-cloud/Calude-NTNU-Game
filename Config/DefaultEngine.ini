[/Script/NavigationSystem.RecastNavMesh]
RuntimeGeneration=Dynamic
; Cell size and step height live in NavMeshResolutionParams (the old CellSize keys are ignored: the engine used 19 cm
; cells, which closed every 1.0 m door). 5 cm cells + radius 25 keep a 40-50 cm strip through 0.9-1.0 m doors.
; Step 45 is rounded down to 40 cm by the 10 cm cell height: stairs (<= 0.20 m) yes, the 0.45 m sitting steps no.
; Height 160: a soldier with his head down under the flight above on the stairs.
NavMeshResolutionParams[0]=(CellSize=10.000000,CellHeight=10.f,AgentMaxStepHeight=45.f)
NavMeshResolutionParams[1]=(CellSize=5.000000,CellHeight=10.f,AgentMaxStepHeight=45.f)
NavMeshResolutionParams[2]=(CellSize=5.000000,CellHeight=10.f,AgentMaxStepHeight=45.f)
TileSizeUU=1600
; Four floors stacked: many layers per tile. A fixed pool so the tile count never runs out (60 was the computed limit).
bFixedTilePoolSize=True
TilePoolSize=1024
AgentRadius=25
AgentHeight=160
AgentMaxHeight=200
AgentMaxSlope=44
bDrawPolyEdges=True
